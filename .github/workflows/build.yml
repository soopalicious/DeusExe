name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # The SDK doesn't ship import libraries, so build them from the export lists
      # (generated from the game's DLLs) in games/DeusEx/<Module>/Lib/<module>.def.
      - name: Generate import libraries
        shell: pwsh
        run: |
          foreach ($def in Get-ChildItem games/DeusEx -Recurse -Filter *.def) {
            $out = Join-Path $def.DirectoryName ($def.BaseName + '.lib')
            lib /nologo /machine:x86 "/def:$($def.FullName)" "/out:$out"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check for Deus Ex SDK files
        shell: pwsh
        run: |
          $missing = @()
          foreach ($dir in 'core/inc','engine/inc','window/inc','deusex/inc','extension/inc',
                           'core/lib/core.lib','engine/lib/engine.lib','window/lib/window.lib','extension/lib/extension.lib') {
            if (-not (Test-Path "games/DeusEx/$dir")) { $missing += "games/DeusEx/$dir" }
          }
          if ($missing.Count -gt 0) {
            Write-Error ("Deus Ex SDK files missing. Copy the SDK's Core, Engine, Window, DeusEx and Extension Inc folders into games/DeusEx/ and add .def export lists for Core, Engine, Window and Extension. Missing:`n" + ($missing -join "`n"))
            exit 1
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release
        # The project targets the VS2015 toolset; build with the one installed on the runner.
        # _CL_=/WX- stops new warnings from the newer compiler failing the build.
        env:
          _CL_: /WX-
        run: >
          msbuild DeusExe.sln /m
          /p:Configuration=Release /p:Platform=Win32
          /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          /p:PostBuildEventUseInBuild=false

      - uses: actions/upload-artifact@v4
        with:
          name: DeusExe
          path: |
            Release/deusex.exe
            Release/DeusExe.u
          if-no-files-found: error
